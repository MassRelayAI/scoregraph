[workspace]
resolver = "2"
members = ["crates/scoregraph-core", "crates/scoregraph-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/MassRelayAI/scoregraph"

[workspace.dependencies]
# serde: typed records (observation/1, rule/1, feedback/1, score/1)
serde = { version = "1", features = ["derive"] }
# serde_json: every format is JSON; maps are BTreeMap (sorted keys), so a serialised value is canonical
serde_json = "1"
# rusqlite (bundled): the ledger; SQLite is compiled in, nothing to install
rusqlite = { version = "0.32", features = ["bundled"] }
# sha2: the hash chain, digests, redaction placeholders
sha2 = "0.10"
# regex: PII redaction, the privacy check, id patterns
regex = "1"
# csv: CompareGraph's RFC 4180 export
csv = "1"
# thiserror: typed errors in the core
thiserror = "1"
# clap (derive): the command line
clap = { version = "4", features = ["derive"] }
# anyhow: error context in the CLI crate only
anyhow = "1"
# tempfile (dev only): throwaway ledgers and repositories
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
