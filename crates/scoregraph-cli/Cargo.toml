[package]
name = "scoregraph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "the scoregraph binary"

[[bin]]
name = "scoregraph"
path = "src/main.rs"

[dependencies]
scoregraph-core = { path = "../scoregraph-core" }
